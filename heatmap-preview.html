<style>
  :root {
    --bg: #07090b;

    --card-soft: #171c21;

    --muted: #9aa7a0;
    --accent: #ff5a2a;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .layout { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
  .map-card { width: 620px; max-width: 100%; }
  .map-card svg { width: 100%; height: auto; display: block; }
  .mz { cursor: pointer; }
  .mz path {
    transition: fill .2s, stroke .2s, filter .2s;
    stroke: #11161a;
    stroke-width: .85;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    filter: url(#muscle-depth);
  }
  .mz.selected path { stroke: #ffb49e; stroke-width: 1.8; filter: url(#muscle-selected); }
  .mz.hover path { stroke: #ffe2d8; stroke-width: 1.45; filter: url(#muscle-hover); }
  .anatomy-base { stroke: #090d10; stroke-width: 1.15; vector-effect: non-scaling-stroke; }
  .neutral-muscle { stroke: #161c20; stroke-width: .8; vector-effect: non-scaling-stroke; }
  .anatomy-line { fill: none; stroke: rgba(255,255,255,.14); stroke-width: .72; stroke-linecap: round; pointer-events: none; vector-effect: non-scaling-stroke; }
  .tendon-line { fill: none; stroke: rgba(215,225,218,.3); stroke-width: 1.05; stroke-linecap: round; pointer-events: none; vector-effect: non-scaling-stroke; }
  .body-midline { fill: none; stroke: rgba(3,6,8,.62); stroke-width: 1; pointer-events: none; vector-effect: non-scaling-stroke; }
  .view-label { fill: var(--muted); font-size: 11px; letter-spacing: 2px; text-anchor: middle; }
  .detail { margin-top: 12px; padding: 10px 12px; background: var(--card-soft); border-radius: 10px; font-size: 13px; min-height: 40px; color: var(--muted); }
  .detail b { color: var(--text); }
  .legend { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 11px; color: var(--muted); }
  .legend-bar { flex: 0 0 120px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(255,90,42,.12), rgba(255,90,42,.92)); }
  .legend-zero { width: 14px; height: 14px; border-radius: 4px; background: var(--card-soft); border: 1px solid var(--border); }
  .controls { display: flex; gap: 14px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .list-card { width: 340px; max-width: 100%; max-height: 710px; overflow-y: auto; }
  .group-title { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; }
  .group-title:first-child { margin-top: 0; }
  .zrow { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .zrow:hover, .zrow.selected { background: var(--card-soft); }
  .zrow .chip { width: 16px; height: 16px; border-radius: 5px; border: 1px solid var(--border); flex: 0 0 16px; }
  .zrow .sets { margin-left: auto; color: var(--muted); font-size: 12px; }
  @media (max-width: 700px) {
    body { padding: 14px; }
    .card { padding: 12px; }
    .map-card { width: 100%; }
  }
</style>

// Cada músculo mantiene su data-subzone original. La geometría sólo cambia
// la representación visual; el heatmap y la selección siguen usando los IDs.
function smoothClosed(pts) {
  const n = pts.length;
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0]} ${p2[1]}`;
  }
  return d + ' Z';
}

function smoothOpenClosed(pts) {
  const n = pts.length;
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, n - 1)];
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0]} ${p2[1]}`;
  }
  return d + ' Z';
}

    {d:'M -29 353 C -31 374 -28 397 -22 417',mirror:true},{d:'M -13 352 C -10 373 -11 397 -17 417',mirror:true},
    {cls:'tendon-line',d:'M -20 421 C -18 437 -18 448 -18 458',mirror:true},
    {cls:'tendon-line',d:'M -62 232 C -61 242 -61 248 -61 254',mirror:true},
    {d:'M -62 260 C -65 267 -66 276 -64 284',mirror:true},{d:'M -18 459 C -15 462 -11 463 -7 463',mirror:true}
  ]
};

const LABELS = {
  pectoral_superior:'Pectoral superior', pectoral_medio:'Pectoral medio', pectoral_inferior:'Pectoral inferior',
  dorsal_ancho:'Dorsal ancho', trapecio_superior:'Trapecio superior', trapecio_medio:'Trapecio medio', trapecio_inferior:'Trapecio inferior',
  romboides:'Romboides', redondo_mayor:'Redondo mayor', erectores_espinales:'Erectores espinales',
  deltoide_anterior:'Deltoide anterior', deltoide_lateral:'Deltoide lateral', deltoide_posterior:'Deltoide posterior',
  biceps_cabeza_larga:'Bíceps cabeza larga', biceps_cabeza_corta:'Bíceps cabeza corta', braquial:'Braquial', braquiorradial:'Braquiorradial',
  triceps_cabeza_larga:'Tríceps cabeza larga', triceps_cabeza_lateral:'Tríceps cabeza lateral', triceps_cabeza_medial:'Tríceps cabeza medial',
  recto_abdominal:'Recto abdominal', oblicuos:'Oblicuos', serrato:'Serrato', cuadriceps:'Cuádriceps', aductores:'Aductores',
  gluteo_mayor:'Glúteo mayor', isquios:'Isquios', gemelos:'Gemelos', tibial_anterior:'Tibial anterior'
};

const GROUPS = {
  Pecho:['pectoral_superior','pectoral_medio','pectoral_inferior'],
  Espalda:['dorsal_ancho','trapecio_superior','trapecio_medio','trapecio_inferior','romboides','redondo_mayor','erectores_espinales'],
  Hombros:['deltoide_anterior','deltoide_lateral','deltoide_posterior'],
  Bíceps:['biceps_cabeza_larga','biceps_cabeza_corta','braquial','braquiorradial'],
  Tríceps:['triceps_cabeza_larga','triceps_cabeza_lateral','triceps_cabeza_medial'],
  Core:['recto_abdominal','oblicuos','serrato'],
  Piernas:['cuadriceps','aductores','gluteo_mayor','isquios','gemelos','tibial_anterior']
};

const DEMO_SETS = {
  pectoral_superior:14.2, pectoral_medio:12.8, pectoral_inferior:4.1, dorsal_ancho:16.5, trapecio_superior:3.2,
  trapecio_medio:7.4, trapecio_inferior:4, romboides:5.6, redondo_mayor:6.1, erectores_espinales:4.4,
  deltoide_anterior:11.3, deltoide_lateral:9.8, deltoide_posterior:5.2, biceps_cabeza_larga:8.9,
  biceps_cabeza_corta:6.7, braquial:4.9, braquiorradial:2.8, triceps_cabeza_larga:9.4,
  triceps_cabeza_lateral:7.7, triceps_cabeza_medial:5.8, recto_abdominal:5.5, oblicuos:2.4, serrato:1.9,
  cuadriceps:6.2, aductores:3.4, gluteo_mayor:6.8, isquios:6.4, gemelos:4, tibial_anterior:0
};

const SILHOUETTE_FILL = 'url(#body-base)';
const NEUTRAL_FILL = 'url(#neutral-muscle)';
const ZERO_FILL = '#252a2e';

function muscleFill(intensity) {
  if (!intensity || intensity <= 0) return ZERO_FILL;
  const alpha = 0.20 + 0.78 * Math.min(intensity, 1);
  return `rgba(255,90,42,${alpha.toFixed(3)})`;
}

function mirrored(d, fill, className) {
  const f = fill ? ` fill="${fill}"` : '';
  const c = className ? ` class="${className}"` : '';
  return `<path d="${d}"${f}${c}/><path d="${d}"${f}${c} transform="scale(-1,1)"/>`;
}

function renderDetails(view) {
  return (ANATOMY_DETAILS[view] || []).map(line => {
    const cls = line.cls || 'anatomy-line';
    return line.mirror
      ? `<path class="${cls}" d="${line.d}"/><path class="${cls}" d="${line.d}" transform="scale(-1,1)"/>`
      : `<path class="${cls}" d="${line.d}"/>`;
  }).join('');
}

function buildView(view, tx) {
  const silhouette = smoothOpenClosed(SILHOUETTES[view]);
  const neutrals = NEUTRAL_SHAPES.both.concat(NEUTRAL_SHAPES[view] || []);
  const neutralSvg = neutrals.map(n => {
    const d = smoothClosed(n.pts);
    return n.mirror ? mirrored(d, NEUTRAL_FILL, 'neutral-muscle') : `<path d="${d}" fill="${NEUTRAL_FILL}" class="neutral-muscle"/>`;
  }).join('');
  const zonesSvg = MUSCLE_ZONES.filter(z => z.view === view).map(z =>
    `<g class="mz" data-subzone="${z.id}">${z.shapes.map(pts => mirrored(smoothClosed(pts))).join('')}</g>`
  ).join('');
  return `<g transform="translate(${tx},8)">
    ${mirrored(silhouette, SILHOUETTE_FILL, 'anatomy-base')}
    ${neutralSvg}
    ${zonesSvg}
    ${renderDetails(view)}
    <text class="view-label" x="0" y="497">${view === 'front' ? 'FRENTE' : 'DORSO'}</text>
  </g>`;
}

function buildSvg() {
  return `<svg viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa anatómico muscular, vista frontal y dorsal">
    <defs>
      <linearGradient id="body-base" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2b3337"/><stop offset=".52" stop-color="#444c4f"/><stop offset="1" stop-color="#293135"/>
      </linearGradient>
      <linearGradient id="neutral-muscle" x1="0" y1="0" x2="0.9" y2="0.15">
        <stop offset="0" stop-color="#3a4245"/><stop offset=".5" stop-color="#51585a"/><stop offset="1" stop-color="#323a3e"/>
      </linearGradient>
      <filter id="muscle-depth" x="-12%" y="-12%" width="124%" height="124%">
        <feDropShadow dx="0" dy=".8" stdDeviation=".55" flood-color="#030506" flood-opacity=".62"/>
      </filter>
      <filter id="muscle-hover" x="-15%" y="-15%" width="130%" height="130%">
        <feDropShadow dx="0" dy="0" stdDeviation="1.3" flood-color="#ffb49e" flood-opacity=".44"/>
      </filter>
      <filter id="muscle-selected" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="0" stdDeviation="1.7" flood-color="#ff5a2a" flood-opacity=".62"/>
      </filter>
    </defs>
    ${buildView('front',135)}
    ${buildView('back',385)}
  </svg>`;
}

function paint() {
  const max = Math.max(...Object.values(DEMO_SETS));
  document.querySelectorAll('.mz').forEach(g => {
    const sets = DEMO_SETS[g.dataset.subzone] || 0;
    const fill = muscleFill(max > 0 ? sets / max : 0);
    g.querySelectorAll('path').forEach(p => {
      p.style.fill = fill;
      p.style.stroke = sets > 0 ? '' : '#465058';
    });
  });
}

function select(id) {
  document.querySelectorAll('.mz, .zrow').forEach(el => el.classList.toggle('selected', (el.dataset.subzone || el.dataset.zone) === id));
  const sets = DEMO_SETS[id] || 0;
  document.getElementById('detail').innerHTML = sets > 0
    ? `<b>${LABELS[id]}</b> — ${sets.toFixed(1)} series efectivas <span style="color:var(--muted)">(datos de ejemplo)</span>`
    : `<b>${LABELS[id]}</b> — sin trabajo en el período <span style="color:var(--muted)">(datos de ejemplo)</span>`;
}

function buildList() {
  const max = Math.max(...Object.values(DEMO_SETS));
  document.getElementById('zone-list').innerHTML = Object.entries(GROUPS).map(([group, ids]) => `
    <div class="group-title">${group}</div>
    ${ids.map(id => `<div class="zrow" data-zone="${id}"><span class="chip" style="background:${muscleFill((DEMO_SETS[id] || 0) / max)}"></span>${LABELS[id]}<span class="sets">${(DEMO_SETS[id] || 0).toFixed(1)}</span></div>`).join('')}
  `).join('');
}

document.getElementById('map').innerHTML = buildSvg();
paint();
buildList();

document.getElementById('map').addEventListener('click', e => {
  const g = e.target.closest('.mz');
  if (g) select(g.dataset.subzone);
});
document.getElementById('map').addEventListener('mouseover', e => {
  const g = e.target.closest('.mz');
  document.querySelectorAll('.mz.hover').forEach(el => el.classList.remove('hover'));
  if (g) document.querySelectorAll(`.mz[data-subzone="${g.dataset.subzone}"]`).forEach(el => el.classList.add('hover'));
});
document.getElementById('map').addEventListener('mouseleave', () => document.querySelectorAll('.mz.hover').forEach(el => el.classList.remove('hover')));
document.getElementById('zone-list').addEventListener('click', e => {
  const row = e.target.closest('.zrow');
  if (row) select(row.dataset.zone);
});
document.getElementById('outlines').addEventListener('change', e => {
  document.querySelectorAll('.mz path').forEach(p => { p.style.stroke = e.target.checked ? '#77838c' : ''; });
  if (!e.target.checked) paint();
});
</script>
</body>
</html>
