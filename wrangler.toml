name = "shymie"
main = "src/index.js"
compatibility_date = "2026-09-21"

# El Worker sirve tambien el frontend: mismo origen para la app y la API.
# Eso elimina CORS, el hack de Content-Type text/plain que pedia Apps Script,
# y la pantalla de "Configurar backend".
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "shymie"
database_id = "PENDIENTE_CORRER_wrangler_d1_create_shymie"
migrations_dir = "migrations"

[vars]
# Los Workers corren en UTC. Sin esto las fechas de sesion se corren un dia.
TZ = "America/Argentina/Buenos_Aires"

# SHYMIE_TOKEN NO va aca: es secreto.
#   produccion -> npx wrangler secret put SHYMIE_TOKEN
#   local      -> archivo .dev.vars (ignorado por git)
